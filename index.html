<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Video Studio</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --txt:#eef0f4; --mut:#9aa3b2; --acc:#4f8cff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#f5b942; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.5 system-ui,-apple-system,"Noto Sans Bengali",sans-serif; padding:16px; padding-bottom:40px; }
  h1 { font-size:22px; margin:4px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mut); margin:12px 0 4px; }
  label:first-child { margin-top:0; }
  input, textarea, select { width:100%; background:#10131a; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:96px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { width:100%; background:var(--acc); color:#fff; border:0; border-radius:12px; padding:14px; font:inherit; font-weight:600; margin-top:14px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); margin-top:8px; }
  button:disabled { opacity:.5; }
  .msg { margin-top:10px; font-size:14px; min-height:20px; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .run { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
  .run:first-of-type { border-top:0; }
  .run a { color:var(--acc); text-decoration:none; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); white-space:nowrap; align-self:flex-start; }
  .tag.success { color:var(--ok); } .tag.failure { color:var(--bad); } .tag.in_progress,.tag.queued { color:var(--warn); }
  small { color:var(--mut); }
  details summary { cursor:pointer; color:var(--mut); }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .modes button { margin:0; padding:12px 8px; background:var(--card); border:1px solid var(--line); color:var(--txt); font-size:14px; line-height:1.3; }
  .modes button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .modes button:disabled { opacity:.45; }
  .hint { font-size:13px; color:var(--mut); margin:8px 0 0; }
  .hide { display:none; }
  .chk { display:flex; gap:10px; align-items:flex-start; color:var(--txt); font-size:14px; margin-top:12px; }
  input[type=checkbox] { width:22px; height:22px; margin:0; flex:none; }
</style>
</head>
<body>
<h1>🎬 Video Studio</h1>

<div class="modes" id="modes">
  <button type="button" data-mode="script" class="on">✍️ স্ক্রিপ্ট দিয়ে ভিডিও</button>
  <button type="button" data-mode="youtube">▶️ ইউটিউব ভিডিও থেকে ভিডিও</button>
  <button type="button" data-mode="cartoon">🧸 কার্টুন (বাচ্চাদের)</button>
  <button type="button" data-mode="documentary">🎥 ডকুমেন্টারি (১০–১৫ মিনিট)</button>
  <button type="button" data-mode="clips">✂️ আসল ভিডিও কেটে ছোট (অনুমতি থাকলে)</button>
  <button type="button" data-mode="other">🎞 অন্যান্য ফরম্যাট</button>
</div>
<p class="hint" id="modeHint"></p>

<div class="card">
  <label for="prompt">কমান্ড (কী ভিডিও চান)</label>
  <textarea id="prompt" placeholder="যেমন: ঘুমের আগের অভ্যাস যা মস্তিষ্কের জন্য ভালো, মোটিভেশনাল স্টাইলে"></textarea>
  <div class="row">
    <div><label for="minutes">কত মিনিট</label><input id="minutes" type="number" inputmode="decimal" min="0.25" max="15" step="0.25" value="1"></div>
    <div><label for="language">ভাষা</label><select id="language"><option value="bn">বাংলা</option><option value="en">English</option></select></div>
  </div>
  <div class="row">
    <div><label for="voice">ভয়েস</label><select id="voice"><option value="female">মেয়ে</option><option value="male">ছেলে</option></select></div>
    <div><label for="format">আকার</label><select id="format"><option value="landscape">ইউটিউব (আড়াআড়ি)</option><option value="portrait">শর্টস/রিলস (লম্বালম্বি)</option></select></div>
  </div>
  <div id="styleBox">
  <label for="style">ফরম্যাট / স্টাইল</label>
  <select id="style">
    <option value="custom">সাধারণ (আমার কমান্ড অনুযায়ী)</option>
    <option value="natok_recap">নাটকের সারসংক্ষেপ (৫–১০ মিনিট, আড়াআড়ি)</option>
    <option value="book_explainer">বই/জ্ঞান ব্যাখ্যা (লম্বালম্বি রিলস)</option>
  </select>
  </div>
  <div id="sourceBox">
  <label for="source">সোর্স ভিডিও লিংক (নাটকের ইউটিউব লিংক, ঐচ্ছিক)</label>
  <input id="source" type="url" placeholder="https://www.youtube.com/watch?v=..." autocapitalize="off" autocorrect="off">
  </div>
  <div id="clipsBox">
    <label for="videoUrl">ভিডিও লিংক (Google Drive / Dropbox / সরাসরি লিংক, অথবা release:ট্যাগ/ফাইলের-নাম)</label>
    <input id="videoUrl" type="url" placeholder="https://drive.google.com/file/d/..." autocapitalize="off" autocorrect="off">
    <div class="row">
      <div><label for="speechLang">ভিডিওর কথার ভাষা</label><select id="speechLang"><option value="bn">বাংলা</option><option value="en">English</option><option value="hi">হিন্দি</option><option value="auto">অটো</option></select></div>
      <div><label for="overlays">পর্দায় লেখা</label><select id="overlays"><option value="captions">শুধু ক্যাপশন</option><option value="captions_titles">ক্যাপশন + ঘটনার শিরোনাম</option><option value="none">কিছু না (একদম আসল)</option></select></div>
    </div>
    <label class="chk"><input type="checkbox" id="rights"> আমি এই ভিডিওর মালিক, অথবা এটা কেটে প্রকাশ করার অনুমতি আমার আছে</label>
  </div>
  <div id="scriptBox">
    <label for="fullScript">পুরো স্ক্রিপ্ট (ঐচ্ছিক): দিলে AI নিজে লিখবে না, এটাই পড়া হবে</label>
    <textarea id="fullScript" placeholder="এখানে নিজের স্ক্রিপ্ট পেস্ট করুন। খালি রাখলে উপরের বিষয় থেকে AI নিজে স্ক্রিপ্ট লিখবে।" style="min-height:120px"></textarea>
  </div>
  <label for="notes" id="notesLabel">স্টাইল নোট (ঐচ্ছিক)</label>
  <input id="notes" placeholder="যেমন: দ্রুত গতির, হুক দিয়ে শুরু">
  <button id="go">ভিডিও বানাও</button>
  <div id="msg" class="msg"></div>
</div>

<div class="card">
  <b>সাম্প্রতিক কাজ</b>
  <div id="runs"><small>লোড হচ্ছে…</small></div>
  <button class="ghost" id="refresh">রিফ্রেশ</button>
</div>

<details class="card">
  <summary>সেটিংস (একবারই দিতে হবে)</summary>
  <label for="repo">প্রাইভেট রিপো (owner/নাম)</label>
  <input id="repo" placeholder="myname/video-studio" autocapitalize="off" autocorrect="off">
  <label for="token">GitHub টোকেন (fine-grained, শুধু ঐ রিপো)</label>
  <input id="token" type="password" placeholder="github_pat_..." autocapitalize="off" autocorrect="off">
  <small>টোকেন শুধু এই ফোনের ব্রাউজারে সংরক্ষিত থাকে।</small>
  <button class="ghost" id="save">সংরক্ষণ</button>
</details>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
$("repo").value = store.get("repo") || "abiralhri-glitch/video-studio";
$("token").value = store.get("token");

function api(path, opts = {}) {
  const repo = store.get("repo") || $("repo").value.trim(), token = store.get("token");
  if (!repo || !token) throw new Error("আগে সেটিংসে রিপো আর টোকেন দিন");
  return fetch(`https://api.github.com/repos/${repo}${path}`, {
    ...opts,
    headers: { "Accept":"application/vnd.github+json", "Authorization":`Bearer ${token}`, "X-GitHub-Api-Version":"2022-11-28", ...(opts.headers||{}) }
  });
}
function say(text, cls="") { $("msg").textContent = text; $("msg").className = "msg " + cls; }

$("save").onclick = () => {
  store.set("repo", $("repo").value.trim());
  store.set("token", $("token").value.trim());
  say("সংরক্ষিত হয়েছে", "ok"); loadRuns();
};

async function clipsRun() {
  const url = $("videoUrl").value.trim();
  if (!url) return say("ভিডিও লিংক দিন", "bad");
  if (!$("rights").checked) return say("অধিকার/অনুমতির ঘরে টিক দিন", "bad");
  const minutes = parseFloat($("minutes").value);
  if (!(minutes >= 1 && minutes <= 30)) return say("মিনিট ১ থেকে ৩০ এর মধ্যে দিন", "bad");
  $("go").disabled = true; say("পাঠানো হচ্ছে…");
  try {
    const r = await api("/actions/workflows/highlights.yml/dispatches", {
      method: "POST",
      body: JSON.stringify({ ref: "main", inputs: {
        video_url: url, minutes: String(minutes), speech_language: $("speechLang").value,
        overlays: $("overlays").value, rights_confirmed: "true", notes: $("notes").value.trim()
      }})
    });
    if (r.status === 204) { say("কাজ শুরু হয়েছে। নিচে অগ্রগতি দেখুন।", "ok"); setTimeout(loadRuns, 4000); }
    else { const j = await r.json().catch(()=>({})); say(`ব্যর্থ (${r.status}): ${j.message || ""}`, "bad"); }
  } catch (e) { say(e.message, "bad"); }
  $("go").disabled = false;
}

$("go").onclick = async () => {
  if (store.get("mode") === "clips") return clipsRun();
  const prompt = $("prompt").value.trim();
  if (!prompt && !$("fullScript").value.trim()) return say("কমান্ড বা পুরো স্ক্রিপ্ট লিখুন", "bad");
  const minutes = parseFloat($("minutes").value);
  if (!(minutes >= 0.25 && minutes <= 30)) return say("মিনিট ০.২৫ থেকে ৩০ এর মধ্যে দিন", "bad");
  $("go").disabled = true; say("পাঠানো হচ্ছে…");
  try {
    const r = await api("/actions/workflows/make-video.yml/dispatches", {
      method: "POST",
      body: JSON.stringify({ ref: "main", inputs: {
        prompt: prompt || "Full script video", minutes: String(minutes), language: $("language").value,
        voice: $("voice").value, format: $("format").value, notes: $("notes").value.trim(),
        style: $("style").value, source_url: $("source").value.trim(), full_script: $("fullScript").value.trim()
      }})
    });
    if (r.status === 204) { say("কাজ শুরু হয়েছে। নিচে অগ্রগতি দেখুন।", "ok"); setTimeout(loadRuns, 4000); }
    else { const j = await r.json().catch(()=>({})); say(`ব্যর্থ (${r.status}): ${j.message || ""}`, "bad"); }
  } catch (e) { say(e.message, "bad"); }
  $("go").disabled = false;
};

const STATUS = { success:"তৈরি", failure:"ব্যর্থ", in_progress:"চলছে", queued:"অপেক্ষায়", cancelled:"বাতিল" };
async function loadRuns() {
  const box = $("runs");
  try {
    const r = await api("/actions/runs?per_page=6");
    if (!r.ok) { box.innerHTML = `<small>লোড হয়নি (${r.status})</small>`; return; }
    const j = await r.json();
    if (!j.workflow_runs.length) { box.innerHTML = "<small>এখনো কোনো কাজ নেই</small>"; return; }
    const repo = store.get("repo") || $("repo").value.trim();
    box.innerHTML = j.workflow_runs.map(w => {
      const st = w.status === "completed" ? w.conclusion : w.status;
      const link = st === "success" ? `https://github.com/${repo}/releases` : w.html_url;
      const label = st === "success" ? "ডাউনলোড" : "বিস্তারিত";
      return `<div class="run"><div>#${w.run_number} · ${new Date(w.created_at).toLocaleString("bn-BD")}<br><a href="${link}" target="_blank" rel="noopener">${label}</a></div><span class="tag ${st}">${STATUS[st] || st}</span></div>`;
    }).join("");
  } catch (e) { box.innerHTML = `<small>${e.message}</small>`; }
}
const MODES = {
  script:  { style:"custom",         styleBox:false, sourceBox:false, hint:"নিজের কমান্ড বা বিষয় লিখে ভিডিও বানান।", notes:"স্টাইল নোট (ঐচ্ছিক)" },
  youtube: { style:"natok_recap",    styleBox:false, sourceBox:true,  hint:"নাটক/ফিল্মের ইউটিউব লিংক দিন, সেটাকে ৫–২৫ মিনিটের নতুন ভিডিওতে রূপান্তর করবে। লিংক না পড়া গেলে সারসংক্ষেপ নিচের নোটে পেস্ট করুন।", notes:"নাটকের সারসংক্ষেপ (লিংক না পড়া গেলে এখানে পেস্ট করুন)", minutes:8 },
  cartoon: { style:"custom",         styleBox:false, sourceBox:false, hint:"বাচ্চাদের কার্টুন ভিডিও সিস্টেম তৈরি হচ্ছে।", notes:"স্টাইল নোট (ঐচ্ছিক)" },
  other:   { style:"book_explainer", styleBox:true,  sourceBox:false, hint:"অন্যান্য তৈরি ফরম্যাট থেকে বেছে নিন।", notes:"স্টাইল নোট (ঐচ্ছিক)" }
};
MODES.clips = { style:"custom", styleBox:false, sourceBox:false, clipsBox:true, hint:"আসল ভিডিও থেকে মূল ঘটনার দৃশ্যগুলো কেটে ছোট ভিডিও বানাবে। আসল ছবি ও আসল ভয়েসই থাকবে। শুধু যে ভিডিওর অধিকার বা অনুমতি আপনার আছে, সেটাতেই ব্যবহার করুন।", notes:"নোট (ঐচ্ছিক)" };
MODES.cartoon = { style:"cartoon_kids", styleBox:false, sourceBox:false, hint:"বাচ্চাদের কার্টুন গল্পের ভিডিও: কার্টুন ছবি, মজার ভয়েস, শেষে শিক্ষা। বিষয় লিখুন (যেমন: খরগোশ আর কচ্ছপের গল্প)।", notes:"স্টাইল নোট (ঐচ্ছিক)" };
MODES.documentary = { style:"documentary", styleBox:false, sourceBox:false, hint:"নতুন ডকুমেন্টারি: বিষয় বললে ১০–১৫ মিনিটের ভিডিও, ইংরেজি বা বাংলা। AI-র বলা তথ্য আপলোডের আগে নিজে যাচাই করে নিন।", notes:"স্টাইল নোট (ঐচ্ছিক)" };
function setMode(m) {
  const c = MODES[m] || MODES.script;
  const clips = m === "clips";
  $("scriptBox").classList.toggle("hide", !["script","cartoon","documentary"].includes(m));
  const mins = parseFloat($("minutes").value);
  if (m === "documentary" && !(mins >= 10 && mins <= 15)) $("minutes").value = 12;
  if (m === "cartoon" && !(mins >= 2 && mins <= 10)) $("minutes").value = 5;
  $("clipsBox").classList.toggle("hide", !clips);
  ["language","voice","format"].forEach(id => $(id).parentElement.classList.toggle("hide", clips));
  document.querySelector('label[for="prompt"]').classList.toggle("hide", clips);
  $("prompt").classList.toggle("hide", clips);
  if (clips && !(parseFloat($("minutes").value) >= 3)) $("minutes").value = 7;
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("styleBox").classList.toggle("hide", !c.styleBox);
  $("sourceBox").classList.toggle("hide", !c.sourceBox);
  $("modeHint").textContent = c.hint;
  $("notesLabel").textContent = c.notes;
  if (m !== "script" || $("style").value !== "custom") $("style").value = c.style;
  if (m === "script") $("style").value = "custom";
  if (c.minutes && !(parseFloat($("minutes").value) >= 5)) $("minutes").value = c.minutes;
  if (m !== "youtube") $("source").value = "";
  store.set("mode", m);
}
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => { if (!b.disabled) setMode(b.dataset.mode); });
setMode(store.get("mode") && MODES[store.get("mode")] ? store.get("mode") : "script");
$("refresh").onclick = loadRuns;
loadRuns();
setInterval(() => { if (!document.hidden && store.get("token")) loadRuns(); }, 20000);
</script>
</body>
</html>
